name: Fashion, Inc. (Fab.com)
description: 'Fashion, Inc. was the legal entity behind Fab.com, the design-focused
  e-commerce and flash-sale marketplace founded in 2010 by Jason Goldberg and Bradford
  Shellhammer after pivoting from the Fabulis social network. Fab raised roughly $150M
  across rounds led by Menlo Ventures, Andreessen Horowitz and Atomico, listed Battery
  Ventures among its backers, and passed ten million members by December 2012 before
  layoffs and a collapse in growth. PCH International acquired Fab''s digital assets
  in March 2015; the site was later repositioned around health and fitness goods and
  went offline in December 2022. The company is defunct and operated no public developer
  program or API. The fab.com domain is today registered to Epic Games, Inc. and serves
  Epic''s unrelated Fab digital-asset marketplace, so nothing currently published at
  that host belongs to this company.'
